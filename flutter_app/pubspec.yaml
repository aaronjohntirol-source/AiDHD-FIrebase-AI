name: aidhd
description: AIDHD — AI-powered ADHD support companion app.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.2
  # Device-only accessibility preferences
  shared_preferences: ^2.3.2
  # Date formatting
  intl: ^0.19.0
  # Google Fonts (Inter + Atkinson Hyperlegible for accessibility)
  google_fonts: ^6.2.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_app_check: ^0.4.8
  cloud_functions: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brain_logo.png
